<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900" role="img" aria-labelledby="title desc">
<title id="title">Represent OS: a home for project understanding</title><desc id="desc">Research infographic comparing Gource and Grafe, describing the Alegor and Dot/Skales inspiration, and recommending a web workspace with an optional local agent before isolated Linux jobs or a full desktop.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10232e"/><stop offset="1" stop-color="#07121a"/></linearGradient><linearGradient id="hero" x2="1"><stop stop-color="#123c3b"/><stop offset="1" stop-color="#162a40"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#62d7c3"/></marker><style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#b2c4cb}.ink{fill:#eef6f6}.teal{fill:#62d7c3}.gold{fill:#ffc979}.blue{fill:#91bfff}.small{font-size:18px}.body{font-size:22px}.head{font-size:27px;font-weight:700}.panel{fill:#10212b;stroke:#29444f;stroke-width:2}</style></defs>
<rect width="1440" height="1900" fill="url(#bg)"/>
<g class="sans">
<text x="80" y="82" class="teal" font-size="19" font-weight="700" letter-spacing="4">REPRESENT · DESIGN RESEARCH · 21 OCTOBER 2026</text>
<text x="80" y="174" class="ink" font-size="74" font-weight="760" letter-spacing="-3">Represent OS</text>
<text x="80" y="226" class="teal" font-size="38" font-weight="650">A home for project understanding</text>
<text x="80" y="274" class="muted body">A tailored web workspace first. Keep project history, code structure, and visual explanation connected by evidence.</text>
<rect x="80" y="320" width="1280" height="476" rx="28" fill="url(#hero)" stroke="#39756d" stroke-width="2"/>
<text x="116" y="369" class="teal small" font-weight="700" letter-spacing="3">ONE PROJECT · SEVERAL LENSES</text>
<g><rect x="116" y="398" width="365" height="135" rx="16" fill="#0c1b24" stroke="#36505a"/><text x="140" y="434" class="teal small" font-weight="700">CURRENT MVP</text><text x="140" y="474" class="ink head">Alegor · project memory</text><text x="140" y="508" class="muted small">Git/docs · snapshots · citations</text>
<rect x="538" y="398" width="365" height="135" rx="16" fill="#0c1b24" stroke="#36505a"/><text x="562" y="434" class="teal small" font-weight="700">CURRENT MVP</text><text x="562" y="474" class="ink head">Grafe · code structure</text><text x="562" y="508" class="muted small">JS/TS symbols · links · source evidence</text>
<rect x="960" y="398" width="365" height="135" rx="16" fill="#0c1b24" stroke="#36505a"/><text x="984" y="434" class="gold small" font-weight="700">PAUSED TRACK</text><text x="984" y="474" class="ink head">Visu · living overview</text><text x="984" y="508" class="muted small">Style-aware explanation · resume later</text></g>
<text x="116" y="590" class="gold small" font-weight="700" letter-spacing="3">PROPOSED SHARED SPINE</text>
<rect x="116" y="615" width="325" height="125" rx="15" fill="#10212b" stroke="#35515b"/><text x="140" y="655" class="ink" font-size="23" font-weight="700">Project sources</text><text x="140" y="690" class="muted small">Repository · Git · chosen records</text><text x="140" y="716" class="muted small">Sessions only with user choice</text>
<path d="M458 677H520" stroke="#62d7c3" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="538" y="615" width="365" height="125" rx="15" fill="#10212b" stroke="#35515b"/><text x="562" y="655" class="ink" font-size="23" font-weight="700">Evidence + project identity</text><text x="562" y="690" class="muted small">Observed · declared · inferred · unknown</text><text x="562" y="716" class="muted small">Claims keep source links and provenance</text>
<path d="M920 677H982" stroke="#62d7c3" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1000" y="615" width="325" height="125" rx="15" fill="#10212b" stroke="#35515b"/><text x="1024" y="655" class="ink" font-size="23" font-weight="700">Open the right lens</text><text x="1024" y="690" class="muted small">Resume · trace · orient · verify</text><text x="1024" y="716" class="muted small">A proposed OS-like web shell</text>

<text x="80" y="864" class="ink" font-size="38" font-weight="700">Gource taught us what Grafe is for</text>
<text x="80" y="902" class="muted body">Gource was run on real repository histories. Its animation is temporal; a source graph answers structural questions.</text>
<rect x="80" y="932" width="400" height="200" rx="18" class="panel"/><text x="108" y="974" class="gold small" font-weight="700" letter-spacing="2">GOURCE · WHEN?</text>
<g fill="none" stroke="#55717a" stroke-width="3"><path d="M130 1026V1060M130 1042H165M130 1060H155M165 1042V1080M155 1060V1100"/><path d="M122 1110H195" stroke="#304b54"/></g><g><circle cx="130" cy="1026" r="6" fill="#b8cad0"/><circle cx="165" cy="1042" r="7" fill="#ffc979"/><circle cx="155" cy="1060" r="6" fill="#62d7c3"/><circle cx="165" cy="1080" r="7" fill="#ffc979"/><circle cx="155" cy="1100" r="6" fill="#86baff"/><circle cx="178" cy="1029" r="5" fill="#ffc979"/><circle cx="193" cy="1029" r="5" fill="#ff9b83"/></g>
<text x="218" y="1018" class="ink" font-size="23" font-weight="700">Evolution · future</text><text x="218" y="1056" class="muted small">Replay file changes over time.</text><text x="218" y="1082" class="muted small">Activity is not code meaning.</text><text x="218" y="1108" class="muted small">Stable positions keep bearings.</text>
<rect x="520" y="932" width="400" height="200" rx="18" class="panel"/><text x="548" y="974" class="blue small" font-weight="700" letter-spacing="2">GRAFE · HOW CONNECTED?</text>
<g fill="none" stroke="#5f8fa0" stroke-width="3"><path d="M568 1050 621 1078 661 1045M621 1078 661 1100M621 1078 566 1105" marker-end="url(#arrow)"/></g><g><circle cx="568" cy="1050" r="12" fill="#193a48" stroke="#86baff" stroke-width="3"/><circle cx="661" cy="1045" r="12" fill="#193a48" stroke="#86baff" stroke-width="3"/><circle cx="621" cy="1078" r="16" fill="#165348" stroke="#62d7c3" stroke-width="4"/><circle cx="661" cy="1100" r="10" fill="#193a48" stroke="#b8cad0" stroke-width="3"/><circle cx="566" cy="1105" r="10" fill="#193a48" stroke="#ffc979" stroke-width="3"/></g>
<text x="700" y="1018" class="ink" font-size="23" font-weight="700">Focus · current MVP</text><text x="700" y="1056" class="muted small">Select one symbol. Follow</text><text x="700" y="1082" class="muted small">callers, references and test</text><text x="700" y="1108" class="muted small">candidates to exact source.</text>
<rect x="960" y="932" width="400" height="200" rx="18" class="panel"/><text x="988" y="974" class="teal small" font-weight="700" letter-spacing="2">GRAFE · WHERE DOES IT LIVE?</text>
<g fill="none" stroke="#55717a" stroke-width="3"><path d="M1008 1027H1080M1020 1040V1095M1080 1027V1060M1048 1040V1078"/><rect x="1003" y="1016" width="89" height="92" rx="8" stroke="#456a73"/><rect x="1037" y="1051" width="43" height="30" rx="3" stroke="#62d7c3" stroke-width="3"/></g><g fill="#86baff"><circle cx="1020" cy="1040" r="5"/><circle cx="1048" cy="1040" r="5"/><circle cx="1020" cy="1095" r="5"/><circle cx="1080" cy="1060" r="5"/></g><text x="1110" y="1018" class="ink" font-size="23" font-weight="700">Overview · future</text><text x="1110" y="1056" class="muted small">Stable map for project</text><text x="1110" y="1082" class="muted small">orientation. Runtime needs</text><text x="1110" y="1108" class="muted small">separately sourced evidence.</text>
<rect x="80" y="1154" width="1280" height="88" rx="14" fill="#282219" stroke="#705c38"/><text x="108" y="1190" class="gold body" font-weight="700">DESIGN CONSEQUENCE</text><text x="108" y="1220" class="ink small">Keep Grafe’s neighborhood legible. Gource is a reference, not Grafe’s renderer; Codevis inspired code-bearing nodes, not a copied codebase.</text>

<text x="80" y="1312" class="ink" font-size="38" font-weight="700">Alegor can feel like Dot without becoming a whole OS</text>
<rect x="80" y="1340" width="620" height="212" rx="18" class="panel"/><text x="110" y="1382" class="teal small" font-weight="700" letter-spacing="2">DOT + SKALES · PRODUCT CUES</text>
<g><rect x="110" y="1400" width="190" height="126" rx="11" fill="#091821" stroke="#42616b" stroke-width="2"/><path d="M110 1420H300" stroke="#42616b" stroke-width="2"/><circle cx="123" cy="1410" r="3" fill="#ff9b83"/><circle cx="135" cy="1410" r="3" fill="#ffc979"/><circle cx="147" cy="1410" r="3" fill="#62d7c3"/><path d="M183 1420V1526" stroke="#35505a"/><rect x="121" y="1433" width="49" height="8" rx="4" fill="#29434e"/><rect x="121" y="1448" width="54" height="15" rx="6" fill="#173b46"/><rect x="121" y="1468" width="48" height="19" rx="6" fill="#173b46"/><rect x="121" y="1495" width="50" height="8" rx="4" fill="#29434e"/><rect x="192" y="1432" width="96" height="64" rx="6" fill="#102631" stroke="#29434e"/><path d="M203 1478 225 1454 245 1468 271 1444" fill="none" stroke="#62d7c3" stroke-width="3"/><circle cx="203" cy="1478" r="4" fill="#ffc979"/><circle cx="225" cy="1454" r="4" fill="#86baff"/><circle cx="245" cy="1468" r="4" fill="#86baff"/><circle cx="271" cy="1444" r="4" fill="#86baff"/><path d="M194 1511H286" stroke="#55717a" stroke-width="3"/><circle cx="226" cy="1511" r="5" fill="#ffc979"/></g>
<text x="326" y="1425" class="ink" font-size="23" font-weight="700">A companion + project pane</text><text x="326" y="1465" class="muted small">Identity · task state · artifacts · review.</text><text x="326" y="1495" class="muted small">Skales docs only; app not run.</text><text x="326" y="1525" class="muted small">Dot pixels do not prove its internals.</text>
<rect x="740" y="1340" width="620" height="212" rx="18" class="panel"/><text x="770" y="1382" class="teal small" font-weight="700" letter-spacing="2">RECOMMENDED RUNTIME · LIGHT TO HEAVY</text><text x="770" y="1424" class="ink head">Web → local service → isolated job</text><text x="770" y="1465" class="muted small">Web shell + current local services; add jobs</text><text x="770" y="1495" class="muted small">only for real execution needs. Compare managed</text><text x="770" y="1525" class="muted small">runners on one task. Desktop only for GUI work.</text>

<text x="80" y="1610" class="ink" font-size="35" font-weight="700">Recommendation</text>
<rect x="80" y="1642" width="1280" height="162" rx="24" fill="#12322f" stroke="#347b6d" stroke-width="2"/>
<text x="116" y="1694" class="teal" font-size="28" font-weight="700">Build Represent Workspace; keep “Represent OS” as metaphor.</text>
<text x="116" y="1737" class="ink body">Start with a web workspace that unifies identity, evidence and the three lenses.</text>
<text x="116" y="1774" class="muted body">Add local access for private code. Use disposable Linux jobs only when a task needs them.</text>
<text x="80" y="1852" class="muted small">Concept proposal · not a shipped OS or runner · details and citations in “Represent OS design and runtime” research report.</text>
</g></svg>
