<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair Clay Notes</title><link rel="stylesheet" href="options.css"></head><body><main><span class="mark">✦</span><h1>A little setup.<br>A lot less watching.</h1><p>Start the Represent service, open the Clay Notes library, and copy its pairing code from <strong>Connect Chrome</strong>.</p><form id="pair"><label>Local service address<input id="base" type="url" value="http://127.0.0.1:8876" required></label><label>Pairing code<input id="token" type="password" autocomplete="off" required placeholder="Paste the code from your library"></label><button>Connect Clay Notes →</button></form><p id="status" role="status"></p><a href="http://127.0.0.1:8876" target="_blank" rel="noreferrer">Open my library ↗</a><p class="quiet">This code connects your extension to your local library. Your AI gateway key stays in the Represent service.</p></main><script src="options.js"></script></body></html>
