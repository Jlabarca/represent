<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clay Notes</title><link rel="stylesheet" href="options.css"></head><body><main>
<span class="mark">✦</span><h1 data-msg="heading">From play to takeaway.</h1><p data-msg="help">Start the local service, open Connect Chrome in your library, and copy the pairing code.</p>
<form id="pair"><label><span data-msg="address">Local service address</span><input id="base" type="url" value="http://127.0.0.1:8876" required dir="ltr"></label><label><span data-msg="pairingCode">Local pairing code</span><input id="token" type="password" autocomplete="off" required dir="ltr"></label><button data-msg="connect">Connect Chrome</button></form>
<p id="status" role="status"></p><a href="http://127.0.0.1:8876" target="_blank" rel="noreferrer" data-msg="library">My library</a><p class="quiet" data-msg="privacy">The pairing code connects your local library. The gateway key stays on the service.</p>
</main><script src="options.js"></script></body></html>
