<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notcards</title><link rel="stylesheet" href="options.css"></head>
<body><main>
  <a class="brand" href="https://not.maremoto.dev" target="_blank" rel="noreferrer"><span class="mark" aria-hidden="true">✦</span><span>not.cards</span></a>
  <h1 data-msg="optionsHeading">Save a video. Keep the ideas.</h1>
  <p data-msg="optionsHelp">Sign in to save this video and open your Notcards library.</p>
  <div id="account" role="status" aria-live="polite"></div>
  <button id="signin" type="button" data-msg="signIn">Continue with Google</button>
  <button id="signout" class="secondary" type="button" hidden data-msg="forgetBrowser">Forget this browser</button>
  <a class="library" href="https://not.maremoto.dev" target="_blank" rel="noreferrer" data-msg="libraryLink">Open my Notcards library</a>
  <p class="privacy" data-msg="privacy">Notcards only reads the video you choose to save.</p>
</main><script src="options.js"></script></body></html>
